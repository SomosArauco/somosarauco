<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcula tu IVA</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f4;
    color: #1f2937;
    padding: 18px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

/* ENCABEZADO */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

h1 {
    font-size: 28px;
    color: #244f8f;
}

.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-top: 5px;
}

/* MODO NOCHE */

.dark-button {
    border: none;
    background: #1f2937;
    color: white;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
}

/* TARJETAS */

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 16px;
}

/* CAMPOS */

.field {
    margin-bottom: 16px;
}

.field:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #4b5563;
}

.input-row {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 11px;
    padding: 12px;
    font-size: 16px;
    color: #1f2937;
    background: white;
}

input:focus {
    outline: none;
    border-color: #315f9e;
}

.paste-button {
    border: none;
    background: #315f9e;
    color: white;
    border-radius: 11px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.paste-button:active {
    transform: scale(0.97);
}

/* SEPARADOR */

.group-title {
    font-size: 16px;
    font-weight: bold;
    color: #315f9e;
    margin: 22px 0 14px;
}

.group-title:first-child {
    margin-top: 0;
}

/* BOTONES */

.calculate-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 14px;
    background: #315f9e;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.clear-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 12px;
    background: #d4d9df;
    color: #374151;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

/* RESULTADO */

.result-card {
    display: none;
}

.month {
    text-align: center;
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 18px;
    text-transform: capitalize;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
    gap: 15px;
}

.result-row:last-child {
    border-bottom: none;
}

.result-label {
    color: #4b5563;
}

.result-value {
    font-weight: bold;
    text-align: right;
}

.result-final {
    margin-top: 10px;
    padding: 18px;
    border-radius: 14px;
    background: #e8f3ea;
    text-align: center;
}

.result-final-label {
    font-size: 14px;
    color: #52705a;
    margin-bottom: 6px;
}

.result-final-value {
    font-size: 30px;
    font-weight: bold;
    color: #28743c;
}

.result-final.saldo {
    background: #e9f0f8;
}

.result-final.saldo .result-final-label {
    color: #506984;
}

.result-final.saldo .result-final-value {
    color: #315f9e;
}

/* MODO NOCHE */

body.dark {
    background: #111827;
    color: #f3f4f6;
}

body.dark .card {
    background: #1f2937;
    box-shadow: none;
}

body.dark h1 {
    color: #78a7df;
}

body.dark .subtitle,
body.dark .month {
    color: #aeb8c5;
}

body.dark label,
body.dark .result-label {
    color: #cbd5e1;
}

body.dark input {
    background: #111827;
    color: white;
    border-color: #374151;
}

body.dark .result-row {
    border-color: #374151;
}

body.dark .clear-button {
    background: #374151;
    color: #e5e7eb;
}

body.dark .result-final {
    background: #153b23;
}

body.dark .result-final-label {
    color: #9bc5a5;
}

body.dark .result-final-value {
    color: #8ed19c;
}

body.dark .result-final.saldo {
    background: #172d45;
}

body.dark .result-final.saldo .result-final-label {
    color: #a6bdd7;
}

body.dark .result-final.saldo .result-final-value {
    color: #91b8e3;
}

/* COMPUTADOR */

@media (min-width: 700px) {

    body {
        padding: 35px;
    }

    h1 {
        font-size: 34px;
    }

    .card {
        padding: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>Calcula tu IVA</h1>
            <div class="subtitle">
                Calcula el IVA del mes de forma rápida
            </div>
        </div>

        <button
            class="dark-button"
            onclick="toggleDarkMode()"
            id="darkButton">
            🌙
        </button>

    </div>


    <!-- COMPRAS -->

    <div class="card">

        <div class="section-title">
            Compras
        </div>

        <div class="group-title">
            Crédito Fiscal
        </div>

        <div class="field">

            <label>
                Facturas de compras
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="facturasCompra"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('facturasCompra')">
                    Pegar
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                Notas de crédito
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="notasCreditoCompra"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('notasCreditoCompra')">
                    Pegar
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                Notas de débito
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="notasDebitoCompra"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('notasDebitoCompra')">
                    Pegar
                </button>

            </div>

        </div>

    </div>


    <!-- VENTAS -->

    <div class="card">

        <div class="section-title">
            Ventas
        </div>

        <div class="group-title">
            Débito Fiscal
        </div>


        <div class="field">

            <label>
                Facturas de venta
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="facturasVenta"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('facturasVenta')">
                    Pegar
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                Boletas
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="boletas"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('boletas')">
                    Pegar
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                Notas de crédito
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="notasCreditoVenta"
                    inputmode="numeric"
                    placeholder="$ 0">

                <button
                    class="paste-button"
                    onclick="pegarValor('notasCreditoVenta')">
                    Pegar
                </button>

            </div>

        </div>

    </div>


    <!-- BOTONES -->

    <div class="card">

        <button
            class="calculate-button"
            onclick="calcularIVA()">

            Calcular IVA

        </button>

        <button
            class="clear-button"
            onclick="limpiarTodo()">

            Limpiar

        </button>

    </div>


    <!-- RESULTADO -->

    <div
        class="card result-card"
        id="resultadoCard">

        <div class="section-title">
            Resultado
        </div>

        <div
            class="month"
            id="mesActual">
        </div>


        <div class="result-row">

            <div class="result-label">
                Total Crédito Fiscal
            </div>

            <div
                class="result-value"
                id="resultadoCompras">
                $0
            </div>

        </div>


        <div class="result-row">

            <div class="result-label">
                Total Débito Fiscal
            </div>

            <div
                class="result-value"
                id="resultadoVentas">
                $0
            </div>

        </div>


        <div class="result-final" id="resultadoFinal">

            <div class="result-final-label">
                IVA a pagar
            </div>

            <div
                class="result-final-value"
                id="ivaPagar">
                $0
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   FORMATO DE NUMEROS
===================================================== */

function formatearCLP(numero) {

    return Math.round(numero).toLocaleString("es-CL");

}


/* =====================================================
   OBTENER NUMERO
===================================================== */

function obtenerNumero(id) {

    const input =
        document.getElementById(id);

    if (!input.value) {
        return 0;
    }

    return Number(
        input.value
        .replace(/\./g, "")
        .replace(/\$/g, "")
        .replace(/\s/g, "")
        .replace(/[^0-9-]/g, "")
    ) || 0;

}


/* =====================================================
   FORMATO AUTOMATICO AL ESCRIBIR
===================================================== */

const campos = [
    "facturasCompra",
    "notasCreditoCompra",
    "notasDebitoCompra",
    "facturasVenta",
    "boletas",
    "notasCreditoVenta"
];


campos.forEach(function(id) {

    const input =
        document.getElementById(id);

    input.addEventListener("input", function() {

        let valor =
            this.value
            .replace(/\D/g, "");

        if (valor === "") {
            this.value = "";
            return;
        }

        this.value =
            Number(valor).toLocaleString("es-CL");

    });

});


/* =====================================================
   BOTON PEGAR
===================================================== */

async function pegarValor(id) {

    const input =
        document.getElementById(id);

    try {

        const texto =
            await navigator.clipboard.readText();

        const numero =
            texto.replace(/\D/g, "");

        if (!numero) {

            alert(
                "No se encontró un monto válido en el portapapeles."
            );

            return;
        }

        input.value =
            Number(numero).toLocaleString("es-CL");

    }

    catch (error) {

        const texto =
            prompt(
                "Pega aquí el monto:"
            );

        if (!texto) {
            return;
        }

        const numero =
            texto.replace(/\D/g, "");

        if (numero) {

            input.value =
                Number(numero).toLocaleString("es-CL");

        }

    }

}


/* =====================================================
   CALCULAR IVA
===================================================== */

function calcularIVA() {

    /*
       COMPRAS

       Facturas de compras
       - Notas de crédito
       + Notas de débito
    */

    const facturasCompra =
        obtenerNumero("facturasCompra");

    const notasCreditoCompra =
        obtenerNumero("notasCreditoCompra");

    const notasDebitoCompra =
        obtenerNumero("notasDebitoCompra");


    const totalCompras =
        facturasCompra
        - notasCreditoCompra
        + notasDebitoCompra;


    /*
       VENTAS

       Facturas de venta
       + Boletas
       - Notas de crédito
    */

    const facturasVenta =
        obtenerNumero("facturasVenta");

    const boletas =
        obtenerNumero("boletas");

    const notasCreditoVenta =
        obtenerNumero("notasCreditoVenta");


    const totalVentas =
        facturasVenta
        + boletas
        - notasCreditoVenta;


    /*
       RESULTADO

       IVA Ventas
       -
       IVA Compras
    */

    const resultado =
        totalVentas
        - totalCompras;


    /* MOSTRAR TOTALES */

    document.getElementById(
        "resultadoCompras"
    ).textContent =
        "$" + formatearCLP(totalCompras);


    document.getElementById(
        "resultadoVentas"
    ).textContent =
        "$" + formatearCLP(totalVentas);


    /* MES ACTUAL */

    const fecha =
        new Date();

    const mes =
        fecha.toLocaleDateString(
            "es-CL",
            {
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById(
        "mesActual"
    ).textContent =
        "Resultado correspondiente a " + mes;


    /* RESULTADO */

    const resultadoFinal =
        document.getElementById(
            "resultadoFinal"
        );

    const etiqueta =
        resultadoFinal.querySelector(
            ".result-final-label"
        );

    const valor =
        document.getElementById(
            "ivaPagar"
        );


    if (resultado > 0) {

        etiqueta.textContent =
            "IVA a pagar";

        valor.textContent =
            "$" + formatearCLP(resultado);

        resultadoFinal.classList.remove(
            "saldo"
        );

    }

    else if (resultado < 0) {

        const saldo =
            Math.abs(resultado);

        etiqueta.textContent =
            "Remanente de IVA";

        valor.textContent =
            "$" + formatearCLP(saldo);

        resultadoFinal.classList.add(
            "saldo"
        );

    }

    else {

        etiqueta.textContent =
            "IVA del mes";

        valor.textContent =
            "$0";

        resultadoFinal.classList.remove(
            "saldo"
        );

    }


    document.getElementById(
        "resultadoCard"
    ).style.display =
        "block";

}


/* =====================================================
   LIMPIAR
===================================================== */

function limpiarTodo() {

    campos.forEach(function(id) {

        document.getElementById(id).value = "";

    });

    document.getElementById(
        "resultadoCard"
    ).style.display =
        "none";

}


/* =====================================================
   MODO NOCHE
===================================================== */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const button =
        document.getElementById(
            "darkButton"
        );

    if (
        document.body.classList.contains("dark")
    ) {

        button.textContent = "☀️";

    }

    else {

        button.textContent = "🌙";

    }

}

</script>

</body>
</html>
